# /etc/wpa_supplicant/wpa_supplicant.conf
#
# Raspberry Pi WiFi client configuration — connects to phone hotspot.
#
# HOW TO APPLY:
#   sudo cp deploy/wpa_supplicant.conf /etc/wpa_supplicant/wpa_supplicant.conf
#   sudo systemctl restart wpa_supplicant
#   sudo systemctl restart dhcpcd
#
# ANDROID hotspot:
#   Default SSID:     AndroidAP  (check Settings > Hotspot)
#   Default gateway:  192.168.43.1
#
# iOS Personal Hotspot:
#   SSID is the iPhone's name (e.g. "John's iPhone")
#   Default gateway:  172.20.10.1
#   Change DEFAULT_SERVER_URL in src/config.rs to ws://172.20.10.1:8765
#
# SECURITY: WPA2-PSK is the default for both Android and iOS hotspots.

ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1
country=US

network={
    # ── Android hotspot ───────────────────────────────────────────────────
    ssid="AndroidAP"
    psk="your_hotspot_password"
    key_mgmt=WPA-PSK

    # Connect to this network above any other saved network.
    priority=10

    # Scan aggressively to find the hotspot quickly on boot.
    scan_ssid=1
}

# ── OPTIONAL: home / office WiFi (lower priority) ────────────────────────────
# network={
#     ssid="HomeWifi"
#     psk="home_wifi_password"
#     key_mgmt=WPA-PSK
#     priority=5
# }
